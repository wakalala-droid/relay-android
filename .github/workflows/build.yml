name: Build Relay APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Relay.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: Relay-apk
          path: Relay.apk

      - name: Publish a release you can download on your phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Relay.apk \
            --title "Relay build ${{ github.run_number }}" \
            --notes "Open this page on each phone and tap Relay.apk to install." \
            --latest
